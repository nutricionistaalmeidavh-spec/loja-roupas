# Ambiente de desenvolvimento local; o instalador guiado de producao sera um modulo posterior.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: loja
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Use scripts/bootstrap-dev.sh para criar a senha local}
      POSTGRES_DB: loja
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - loja_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loja -d loja"]
      interval: 5s
      retries: 12
      timeout: 3s
volumes:
  loja_pgdata:
