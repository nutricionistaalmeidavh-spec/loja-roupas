openapi: 3.1.0
info:
  title: Inteligência comercial
  version: 0.1.0
security:
  - Session: []
    Store: []
paths:
  /v1/management/intelligence:
    get:
      summary: Consultar metas, sazonalidade, projeção e evidências da loja
      responses:
        '200':
          description: Valores monetários em centavos decimais e janelas no fuso da loja
          content:
            application/json:
              schema:
                type: object
                required: [preferences, daily, months, forecast, collections, suppliers, low_stock]
                properties:
                  preferences: { $ref: '#/components/schemas/Preferences' }
                  daily: { type: array, items: { $ref: '#/components/schemas/Period' } }
                  months: { type: array, items: { $ref: '#/components/schemas/Period' } }
                  historical_months: { type: array, items: { $ref: '#/components/schemas/Period' } }
                  forecast: { type: object }
                  collections: { type: array, items: { type: object } }
                  suppliers: { type: array, items: { type: object } }
                  low_stock: { type: array, items: { type: object } }
    put:
      summary: Salvar meta padrão mensal, janela de estoque e widgets da loja
      parameters:
        - $ref: '#/components/parameters/WriteKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Preferences' }
      responses:
        '200': { description: Preferências auditadas }
  /v1/management/intelligence/products/{id}/collection:
    put:
      summary: Atribuir ou limpar o nome da coleção atual de um produto
      parameters:
        - $ref: '#/components/parameters/WriteKey'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collection]
              properties:
                collection: { type: string, maxLength: 80 }
      responses:
        '200': { description: Coleção atualizada e auditada }
        '404': { description: Produto indisponível na loja }
  /v1/management/product-fields:
    post:
      summary: Criar campo privado de texto aplicável aos produtos da loja
      parameters:
        - $ref: '#/components/parameters/WriteKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string, minLength: 1, maxLength: 60 }
      responses:
        '201': { description: Campo criado }
        '409': { description: Nome já utilizado ou limite de 12 campos atingido }
  /v1/management/products/{id}/fields:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Listar campos da loja e valores do produto
      responses:
        '200': { description: Campos e respectivos valores ou nulos }
        '404': { description: Produto indisponível nesta loja }
  /v1/management/products/{id}/fields/{fieldId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: fieldId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      summary: Gravar ou limpar texto no campo do produto
      parameters:
        - $ref: '#/components/parameters/WriteKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: string, maxLength: 240 }
      responses:
        '200': { description: Valor salvo ou limpo }
        '404': { description: Produto ou campo indisponível nesta loja }
  /v1/management/purchases/{id}/quality:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      summary: Informar quantas unidades recebidas passaram na inspeção
      parameters:
        - $ref: '#/components/parameters/WriteKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accepted_quantity]
              properties:
                accepted_quantity: { type: integer, minimum: 0, maximum: 100000 }
      responses:
        '200': { description: Inspeção registrada }
        '409': { description: Compra indisponível ou quantidade acima do recebido }

components:
  parameters:
    WriteKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
  securitySchemes:
    Session: { type: http, scheme: bearer }
    Store: { type: apiKey, in: header, name: X-Store-Id }
  schemas:
    Preferences:
      type: object
      required: [target_cents, low_stock_limit, widgets]
      additionalProperties: false
      properties:
        target_cents: { type: integer, minimum: 0, maximum: 9999999999 }
        low_stock_limit: { type: integer, minimum: 0, maximum: 999 }
        widgets:
          type: array
          uniqueItems: true
          maxItems: 4
          items: { enum: [seasonality, collections, suppliers, stock] }
    Period:
      type: object
      required: [period, gross_cents, refunded_cents]
      properties:
        period: { type: string, format: date }
        gross_cents: { type: string }
        refunded_cents: { type: string }
