openapi: 3.1.0
info:
  title: Loja de Roupas — operação, gestão e vitrine
  version: 0.1.0
security:
  - bearer: []
    store: []
paths:
  /v1/management/operations/summary:
    get:
      summary: Central de ações operacional canônica da loja selecionada
      description: Métricas do PostgreSQL por store_id. Não contém informações de outras lojas.
      responses:
        '200':
          description: Contagens operacionais e data de geração
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [counts, generated_at]
                properties:
                  generated_at: { type: string, format: date-time }
                  counts:
                    type: object
                    additionalProperties: false
                    required:
                      - purchases_to_receive
                      - purchase_quarantine_units
                      - purchase_missing_units
                      - pickups_pending
                      - holds_active
                      - print_jobs_pending
                      - returned_quarantine_units
                      - partially_returned_sales
                      - low_stock_variants
                    properties:
                      purchases_to_receive: { type: integer, minimum: 0 }
                      purchase_quarantine_units: { type: integer, minimum: 0 }
                      purchase_missing_units: { type: integer, minimum: 0 }
                      pickups_pending: { type: integer, minimum: 0 }
                      holds_active: { type: integer, minimum: 0 }
                      print_jobs_pending: { type: integer, minimum: 0 }
                      returned_quarantine_units: { type: integer, minimum: 0 }
                      partially_returned_sales: { type: integer, minimum: 0 }
                      low_stock_variants: { type: integer, minimum: 0 }
        '401': { description: Sessão ou loja sem autorização }
        '403': { description: Sem permissão de leitura gerencial }
  /v1/sales/{id}/print-requests:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      summary: Registrar a solicitação de impressão do comprovante não fiscal
      parameters:
        - $ref: '#/components/parameters/WriteKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paper_mm]
              additionalProperties: false
              properties:
                paper_mm: { type: integer, enum: [58, 80] }
      responses:
        '201':
          description: Solicitação registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdResult' }
        '404': { description: Venda indisponível para o operador }
  /v1/management/sales-summary:
    get:
      summary: Consultar vendas confirmadas por dia no fuso da loja
      responses:
        '200':
          description: Resumo dos últimos 30 dias
          content:
            application/json:
              schema:
                type: object
                properties:
                  days:
                    type: array
                    items:
                      type: object
                      properties:
                        day: { type: string, format: date }
                        sale_count: { type: integer }
                        gross_cents: { type: string, pattern: '^[0-9]+$' }
                        refunded_cents: { type: string, pattern: '^[0-9]+$' }
  /v1/management/suppliers:
    get:
      summary: Listar fornecedores cadastrados na loja
      responses:
        '200':
          description: Fornecedores
          content:
            application/json:
              schema:
                type: object
                properties:
                  suppliers:
                    type: array
                    items: { $ref: '#/components/schemas/Supplier' }
    post:
      summary: Cadastrar fornecedor
      parameters:
        - $ref: '#/components/parameters/WriteKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120, pattern: '\S' }
      responses:
        '201':
          description: Fornecedor registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Supplier' }
        '409': { description: Nome duplicado ou conflito de idempotência }
  /v1/management/storefront/variants/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      summary: Alterar a publicação de uma variante
      parameters:
        - $ref: '#/components/parameters/WriteKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Publication' }
      responses:
        '200':
          description: Visibilidade registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Publication' }
        '404': { description: Variante indisponível nesta loja }
  /v1/storefront/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      security: []
      summary: Ler uma página pública de variantes publicadas pelo ID da loja
      parameters:
        - name: after
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Até 50 variantes e cursor para a próxima página
          content:
            application/json:
              schema:
                type: object
                properties:
                  next: { type: [string, 'null'], format: uuid }
                  pickup_enabled: { type: boolean }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        color: { type: string }
                        size: { type: string }
                        price_cents: { type: string, pattern: '^[0-9]+$' }
                        available: { type: boolean }
                        photo_url: { type: [string, 'null'] }
  /v1/storefront/{id}/products/{productId}/photo:
    get:
      security: []
      summary: Obter miniatura ou imagem de um produto publicado
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Imagem, com preferência pela miniatura WebP }
        '404': { description: Foto indisponível para a vitrine }
  /v1/stock/holds:
    get:
      summary: Ler até 100 reservas ativas da loja por ordem de criação
      responses:
        '200':
          description: Reservas ativas
          content:
            application/json:
              schema:
                type: object
                properties:
                  holds:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        sku: { type: string }
                        quantity: { type: integer }
                        created_at: { type: string, format: date-time }
                        state: { type: string, enum: [active] }
                        stale: { type: boolean, description: Reserva ativa há mais de 24 horas, revisão manual recomendada }
    post:
      summary: Reservar unidades disponíveis para atendimento interno
      parameters:
        - $ref: '#/components/parameters/WriteKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [variant_id, quantity]
              properties:
                variant_id: { type: string, format: uuid }
                quantity: { type: integer, minimum: 1, maximum: 999 }
      responses:
        '201':
          description: Reserva criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdResult' }
        '409': { description: Saldo insuficiente ou conflito de idempotência }
  /v1/stock/holds/{id}/release:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      summary: Liberar as unidades de uma reserva interna
      parameters:
        - $ref: '#/components/parameters/WriteKey'
      responses:
        '200':
          description: Reserva liberada
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  released: { const: true }
        '404': { description: Reserva ativa indisponível nesta loja }
  /v1/management/storefront/pickup:
    put:
      summary: Ativar ou pausar a entrada de pedidos para retirada
      parameters:
        - $ref: '#/components/parameters/WriteKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              additionalProperties: false
              properties:
                enabled: { type: boolean }
      responses:
        '200': { description: Preferência atualizada }
  /v1/storefront/{id}/pickup-orders:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      security: []
      summary: Receber um pedido para retirada pago posteriormente na loja
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [request_id, lines]
              properties:
                request_id: { type: string, format: uuid }
                lines:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { $ref: '#/components/schemas/PickupLine' }
      responses:
        '201':
          description: Pedido recebido com código de retirada
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  quoted_total_cents: { type: string }
        '404': { description: Recebimento de pedidos desativado }
        '409': { description: Estoque indisponível ou chave reutilizada em outro pedido }
        '429': { description: Limite temporário de submissões atingido }
  /v1/pickup-orders/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Consultar as linhas de um pedido pendente no PDV
      responses:
        '200':
          description: Pedido recuperado para cotação
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  quoted_total_cents: { type: string }
                  lines:
                    type: array
                    items: { $ref: '#/components/schemas/PickupLine' }
        '404': { description: Pedido não encontrado na loja }
        '409': { description: Pedido já vendido ou expirado }
  /v1/management/sales/by-number/{number}:
    parameters:
      - $ref: '#/components/parameters/SaleNumber'
    get:
      summary: Consultar uma venda pelo número para atendimento de devolução
      responses:
        '200': { description: Venda com linhas, quantidades já devolvidas e saldos por linha para devolução }
        '404': { description: Venda não encontrada na loja }
  /v1/management/sales/by-number/{number}/cash-return:
    parameters:
      - $ref: '#/components/parameters/SaleNumber'
    post:
      summary: Devolver uma ou mais peças de venda paga em dinheiro, com avaliação física e reembolso atômico
      parameters:
        - $ref: '#/components/parameters/WriteKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [cash_session_id, reason, items]
              properties:
                cash_session_id: { type: string, format: uuid }
                reason: { type: string, minLength: 8, maxLength: 250 }
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required: [sale_line_id, quantity, condition]
                    properties:
                      sale_line_id: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1, maximum: 10000 }
                      condition: { type: string, enum: [resellable, quarantine] }
      responses:
        '201': { description: Devolução registrada com saldo esperado de caixa }
        '409': { description: Venda indisponível, caixa fechado ou saldo insuficiente }
        '422': { description: Forma de pagamento inelegível ou justificativa inválida }

  /v1/management/print-queue:
    get:
      summary: Listar até 100 comprovantes pendentes da loja, do mais antigo ao mais novo
      responses:
        '200': { description: Lista de jobs pendentes com número da venda e largura do papel }
  /v1/management/print-queue/{id}/complete:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      summary: Registrar confirmação do operador após impressão
      parameters:
        - $ref: '#/components/parameters/WriteKey'
      responses:
        '200': { description: Confirmação registrada }
        '409': { description: Comprovante concluído ou indisponível }
  /v1/management/purchases:
    get:
      summary: Listar até 100 pedidos de compra da loja
      responses:
        '200': { description: Pedidos de compra com custos e status de recebimento }
    post:
      summary: Criar pedido de compra por SKU
      parameters:
        - $ref: '#/components/parameters/WriteKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [supplier_id, variant_id, quantity, unit_cost_cents]
              properties:
                supplier_id: { type: string, format: uuid }
                variant_id: { type: string, format: uuid }
                quantity: { type: integer, minimum: 1, maximum: 100000 }
                promised_on: { type: string, format: date }
                unit_cost_cents: { type: integer, minimum: 0, maximum: 100000000 }
      responses:
        '201': { description: Pedido de compra registrado }
        '409': { description: Fornecedor ou variante indisponível para a loja ou conflito de chave }
  /v1/management/purchases/{id}/receive:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      summary: Conferir quantidade entregue e aprovada antes de liberar estoque vendável
      parameters:
        - $ref: '#/components/parameters/WriteKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [received_quantity, accepted_quantity]
              properties:
                received_quantity: { type: integer, minimum: 1, maximum: 100000 }
                accepted_quantity: { type: integer, minimum: 0, maximum: 100000 }
                reason: { type: string, maxLength: 250 }
      responses:
        '200': { description: Quantidades aprovadas, reprovadas e faltantes registradas atomicamente }
        '422': { description: Inconsistência de quantidade ou divergência sem justificativa }
        '409': { description: Compra recebida ou indisponível }
  /v1/management/pickup-orders:
    get:
      summary: Listar até 100 pedidos de retirada pendentes da loja
      responses:
        '200': { description: Pedidos pendentes dentro do prazo de retirada }
  /v1/management/pickup-orders/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      summary: Cancelar pedido de retirada pendente
      parameters:
        - $ref: '#/components/parameters/WriteKey'
      responses:
        '200': { description: Cancelamento registrado }
        '409': { description: Pedido indisponível para cancelamento }
  /v1/storefront/{id}/pickup-orders/{orderId}/status:
    get:
      security: []
      summary: Consultar somente a situação do pedido pelo código de retirada
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Situação atual
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { enum: [pending, complete, expired, cancelled] }
        '404': { description: Código indisponível nesta vitrine }

components:
  parameters:
    SaleNumber:
      name: number
      in: path
      required: true
      schema: { type: string, pattern: '^[1-9][0-9]{0,15}$' }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    WriteKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,128}$' }
  schemas:
    PickupLine:
      type: object
      required: [variant_id, quantity]
      additionalProperties: false
      properties:
        variant_id: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 10 }
    IdResult:
      type: object
      properties:
        id: { type: string, format: uuid }
    Supplier:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    Publication:
      type: object
      required: [published]
      additionalProperties: false
      properties:
        published: { type: boolean }
  securitySchemes:
    bearer: { type: http, scheme: bearer }
    store: { type: apiKey, in: header, name: X-Store-Id }
