name: Capturas Loja Física v0.2.7 - loja demonstrativa
on:
  push:
    branches: [qa/prints-desktop-demo-v027]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências Playwright fixadas
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate
          pnpm install --frozen-lockfile
          if($LASTEXITCODE -ne 0){throw 'Dependências falharam'}
      - name: Instalar release publicada e validar checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download loja-fisica-v0.2.7 --repo ${{ github.repository }} --pattern 'Loja-de-Roupas-Fisica-Setup-x64.exe' --pattern 'SHA256SUMS' --dir qa-installer
          if($LASTEXITCODE -ne 0){throw 'Download falhou'}
          $exe=(Resolve-Path 'qa-installer/Loja-de-Roupas-Fisica-Setup-x64.exe').Path
          $expected=((Get-Content 'qa-installer/SHA256SUMS' -Raw).Trim() -split '\s+')[0]
          if((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected.ToLowerInvariant()){throw 'Checksum divergente'}
          $p=Start-Process $exe -ArgumentList '/S' -Wait -PassThru
          if($p.ExitCode -ne 0){throw 'Instalação falhou'}
          $install=Join-Path $env:LOCALAPPDATA 'Programs\Loja de Roupas Fisica'
          if((Get-Content "$install/app/resources/app/package.json" -Raw|ConvertFrom-Json).version -ne '0.2.7'){throw 'Versão incorreta'}
      - name: Capturar janelas reais Electron com Playwright
        shell: pwsh
        run: |
          @'
          import {strict as assert} from 'node:assert';
          import {mkdtemp,rm,mkdir} from 'node:fs/promises';
          import {tmpdir} from 'node:os';
          import path from 'node:path';
          import {createRequire} from 'node:module';
          
          const require=createRequire(new URL('../apps/web/package.json',import.meta.url));
          const {_electron:electron}=require('@playwright/test');
          const executablePath=process.argv[2];
          if(!executablePath||!path.isAbsolute(executablePath))throw Error('Electron absoluto obrigatório');
          const userData=await mkdtemp(path.join(tmpdir(),'loja-local-pg-'));
          let instance;
          const out=path.resolve('qa-desktop-prints');
          await mkdir(out,{recursive:true});
          const shot=async (page,name)=>{await page.evaluate(()=>document.fonts.ready);await page.screenshot({path:path.join(out,name+'.png'),animations:'disabled',timeout:20000});};
          try{
           const env={...process.env};
           delete env.LOJA_SERVER_URL;
           instance=await electron.launch({executablePath,args:['--user-data-dir='+userData],
            chromiumSandbox:true,env,timeout:45000});
           const setup=await instance.firstWindow({timeout:25000});
           try{
            await Promise.race([
             setup.getByRole('heading',{name:'Crie sua loja'}).waitFor({timeout:110000}),
             setup.getByText('Não foi possível iniciar',{exact:true}).waitFor({timeout:110000})
              .then(()=>{throw new Error('Falha na inicialização do servidor local');})
            ]);
           }catch(error){
            console.error('Estado do assistente Windows:',await setup.locator('body').innerText().catch(()=>'<janela encerrada>'));
            throw error;
           }
           await shot(setup,'01-configuracao-inicial');
           await setup.locator('input[name=name]').fill('Ateliê Aurora | Loja Demo');
           await setup.locator('input[name=login]').fill('local-admin');
           await setup.locator('input[name=password]').fill('Senha-Local-CI-2026');
           await setup.getByRole('button',{name:'Criar loja e começar'}).click();
           const windows=instance.windows();
           let appWindow=windows.find(w=>w.url().startsWith('http://127.0.0.1:'));
           for(let i=0;i<150&&!appWindow;i++){
            await new Promise(resolve=>setTimeout(resolve,400));
            appWindow=instance.windows().find(w=>w.url().startsWith('http://127.0.0.1:'));
           }
           assert.ok(appWindow,'Aplicativo não abriu após bootstrap');
           // O aviso de atualização pode aparecer após o primeiro carregamento. No smoke,
           // apenas dispensar o modal, sem instalar ou baixar nenhuma atualização.
           await appWindow.addLocatorHandler(appWindow.getByRole('dialog',{name:'Atualização da loja'}),async modal=>{
            await modal.getByRole('button',{name:'Agora não'}).click();
           });
           try {
            await appWindow.getByRole('heading',{name:'Bem-vindo à sua loja'}).waitFor({timeout:30000});
           } catch(error){
            console.error('Windows login URL:',appWindow.url());
            console.error('Windows page title:',await appWindow.title().catch(()=>'<sem titulo>'));
            console.error('Windows body:',(await appWindow.locator('body').innerText().catch(()=>'<sem body>')).slice(0,1500));
            console.error('Windows document:',await appWindow.evaluate(()=>({
             state:document.readyState,root:document.querySelector('#root')?.innerHTML.slice(0,500),
             scripts:[...document.scripts].map(s=>s.src).slice(0,5)
            })).catch(e=>({error:String(e)})));
            console.error('Setup state:',(await setup.locator('body').innerText().catch(()=>'<janela fechada>')).slice(0,1000));
            throw error;
           }
           await instance.evaluate(({BrowserWindow})=>{const w=BrowserWindow.getAllWindows().find(w=>w.webContents.getURL().startsWith('http://127.0.0.1:'));if(w)w.maximize();});
           await shot(appWindow,'02-login');
           const origin=new URL(appWindow.url()).origin;
           assert.equal(new URL(origin).hostname,'127.0.0.1');
           // Test the real installed native recovery IPC, without requiring internet
           // and without erasing or reinitializing PostgreSQL.
           const recoveryPromise=instance.waitForEvent('window',{timeout:15000});
           await appWindow.getByRole('button',{name:/Esqueci minha senha/}).click();
           const recovery=await recoveryPromise;
           await recovery.getByRole('heading',{name:'Recuperar acesso ao administrador'}).waitFor();
           await shot(recovery,'03-recuperacao');
           await recovery.locator('input[name=login]').fill('local-admin');
           await recovery.locator('input[name=password]').fill('Senha-redefinida-CI-2026');
           await recovery.locator('input[name=confirmation]').fill('Senha-redefinida-CI-2026');
           await recovery.getByRole('button',{name:'Redefinir senha neste computador'}).click();
           await recovery.getByText('Senha alterada.',{exact:false}).waitFor({timeout:30000});
           await recovery.close();
           const old=await fetch(origin+'/v1/auth/sessions',{
            method:'POST',headers:{'content-type':'application/json'},
            body:JSON.stringify({login:'local-admin',password:'Senha-Local-CI-2026'})
           });
           assert.equal(old.status,401,'Senha antiga deve ser recusada após redefinição');
           const {randomUUID}=await import('node:crypto');
           const credentials=await fetch(origin+'/v1/auth/sessions',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({login:'local-admin',password:'Senha-redefinida-CI-2026'})});
           assert.ok(credentials.ok,'Login API demo falhou');
           const auth=await credentials.json();
           const h={authorization:'Bearer '+auth.token,'x-store-id':auth.stores[0].store_id};
           async function api(route,method='GET',body,type='application/json'){
            const response=await fetch(origin+route,{method,headers:{...h,...(method!=='GET'?{'content-type':type,'idempotency-key':randomUUID()}: {})},...(body===undefined?{}:{body:type==='application/json'?JSON.stringify(body):body})});
            const raw=await response.text();
            if(!response.ok)throw new Error(method+' '+route+' '+response.status+' '+raw.slice(0,500));
            return raw?JSON.parse(raw):null;
           }
           const products=[
            ['Camiseta Essential','Masculino','CAM','Branco',6990,'shirt','#e9e5dd',['P','M','G','GG']],
            ['Camisa de linho','Masculino','LIN','Azul marinho',15990,'collar','#344a65',['P','M','G']],
            ['Calça jeans slim','Masculino','JEA','Azul índigo',18990,'pants','#344968',['38','40','42','44']],
            ['Polo piquet','Masculino','POL','Verde oliva',11990,'collar','#75806b',['P','M','G']],
            ['Vestido midi Aurora','Feminino','VES','Terracota',21990,'dress','#b8735d',['P','M','G']],
            ['Blusa canelada','Feminino','BLU','Areia',8990,'shirt','#bfa88e',['P','M','G']],
            ['Calça pantalona','Feminino','PAN','Preto',17990,'pants','#313238',['36','38','40','42']],
            ['Saia midi plissada','Feminino','SAI','Rosa antigo',13990,'skirt','#b3848d',['P','M','G']],
            ['Bolsa transversal','Acessórios','BOL','Caramelo',15990,'bag','#9e6541',['Único']],
            ['Tênis casual','Calçados','TEN','Off white',22990,'shoe','#e0d8c6',['36','37','38','39','40']],
            ['Jaqueta urbana','Masculino','JAQ','Cinza',24990,'collar','#636970',['M','G','GG']],
            ['Regata basic','Feminino','REG','Lilás',5990,'tank','#a49ab9',['P','M','G']]
           ];
           const paths={
            shirt:'M 139 74 L 190 50 L 218 62 Q 250 100 282 62 L 310 50 L 361 74 L 419 151 L 360 193 L 333 153 L 333 383 Q 250 397 167 383 L 167 153 L 140 193 L 81 151 Z',
            collar:'M 139 74 L 190 50 L 218 62 L 282 62 L 310 50 L 361 74 L 419 151 L 360 193 L 333 153 L 333 383 Q 250 397 167 383 L 167 153 L 140 193 L 81 151 Z',
            pants:'M 155 60 L 345 60 L 358 143 L 322 421 L 253 421 L 250 201 L 247 201 L 244 421 L 174 421 L 142 143 Z',
            dress:'M 197 60 L 222 60 Q 250 113 278 60 L 303 60 L 321 143 L 294 204 L 365 417 Q 250 441 135 417 L 206 204 L 179 143 Z',
            skirt:'M 198 106 L 302 106 L 366 390 Q 250 417 134 390 Z',
            bag:'M 143 151 Q 250 133 357 151 L 377 361 Q 250 389 123 361 Z',
            shoe:'M 98 266 Q 130 263 174 210 L 218 173 Q 257 215 289 236 L 367 255 Q 407 265 414 306 L 412 333 Q 247 350 91 333 L 85 300 Z',
            tank:'M 184 67 L 213 56 Q 250 110 287 56 L 316 67 Q 304 137 333 166 L 333 383 Q 250 397 167 383 L 167 166 Q 196 137 184 67 Z'
           };
           for(const [name,category,sku,color,price,kind,tint,sizes] of products){
            const p=await api('/v1/catalog/products','POST',{name,category,variants:sizes.map(size=>({sku:sku+'-'+size.replace('Único','U'),color,size,price_cents:price}))});
            const data=await appWindow.evaluate(({kind,tint,outline})=>{
             const c=document.createElement('canvas');c.width=500;c.height=480;const ctx=c.getContext('2d');
             const bg=ctx.createRadialGradient(250,175,50,250,240,390);bg.addColorStop(0,'#faf9f6');bg.addColorStop(1,'#dedbd4');ctx.fillStyle=bg;ctx.fillRect(0,0,500,480);
             const shape=new Path2D(outline);const grad=ctx.createLinearGradient(90,80,400,410);grad.addColorStop(0,'#ffffff');grad.addColorStop(.15,tint);grad.addColorStop(.65,tint);grad.addColorStop(1,'#323232');
             ctx.save();ctx.shadowColor='#00000038';ctx.shadowBlur=20;ctx.shadowOffsetY=12;ctx.fillStyle=tint;ctx.fill(shape);ctx.restore();
             ctx.save();ctx.clip(shape);ctx.globalAlpha=.28;ctx.fillStyle=grad;ctx.fillRect(0,0,500,480);ctx.globalAlpha=1;
             let s=17;for(let i=0;i<14000;i++){s=(s*16807)%2147483647;let x=s%500;s=(s*16807)%2147483647;let y=s%480;ctx.fillStyle=i%2?'#ffffff12':'#00000010';ctx.fillRect(x,y,1.5,1.5);}
             ctx.strokeStyle='#00000025';ctx.lineWidth=2;ctx.stroke(shape);
             function line(d,color='#00000038',width=2){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke(new Path2D(d));}
             if(['shirt','collar','tank'].includes(kind)){line('M 175 365 Q 250 377 325 365');line('M 218 64 Q 250 110 282 64','#00000055',4);if(kind==='collar'){line('M 190 50 L 222 106 L 250 77 L 278 106 L 310 50','#00000065',4);line('M 250 77 L 250 380','#00000045',3);for(let y=115;y<365;y+=42){ctx.fillStyle='#ffffff99';ctx.beginPath();ctx.arc(256,y,3,0,Math.PI*2);ctx.fill();}}}
             if(kind==='pants'){line('M 151 112 L 349 112');line('M 250 70 L 250 178');line('M 155 132 Q 200 155 210 111 M 345 132 Q 300 155 290 111');line('M 184 407 L 242 407 M 258 407 L 317 407');}
             if(kind==='dress'||kind==='skirt'){for(let x=174;x<340;x+=29)line('M 250 190 Q '+x+' 305 '+x+' 420','#00000018',4);line('M 204 205 L 296 205','#00000045',4);}
             if(kind==='bag'){line('M 130 190 Q 250 233 370 190','#00000055',3);ctx.fillStyle='#d6b27c';ctx.fillRect(237,211,26,18);}
             if(kind==='shoe'){line('M 85 308 Q 250 328 414 306','#ffffffbb',15);for(let i=0;i<5;i++)line('M '+(192+i*13)+' '+(213+i*5)+' l 36 -13','#faf7ed',5);}
             ctx.restore();if(kind==='bag'){ctx.strokeStyle=tint;ctx.lineWidth=15;ctx.stroke(new Path2D('M 160 155 Q 160 45 250 45 Q 340 45 340 155'));}
             return c.toDataURL('image/png').split(',')[1];
            },{kind,tint,outline:paths[kind]});
            await api('/v1/catalog/products/'+p.id+'/photo','PUT',Buffer.from(data,'base64'),'image/png');
           }
           const catalog=await api('/v1/catalog/products?limit=50');
           assert.equal(catalog.items.length,products.length,'Produtos incompletos');
           assert.equal(catalog.items.filter(p=>p.has_photo).length,products.length,'Fotos incompletas');
           let vi=0;const variants=[];
           for(const product of catalog.items)for(const variant of product.variants){
            variants.push(variant);
            await api('/v1/stock/receipts','POST',{variant_id:variant.id,reference_id:randomUUID(),quantity:7+(vi++*7)%24,note:'Recebimento demonstrativo'});
           }
           const customers=[];
           for(const [i,name] of ['Marina Duarte','Lucas Ribeiro','Camila Torres','Rafael Martins','Isabela Costa','Bruno Lima'].entries()){
            const customer=await api('/v1/management/customers','POST',{name,email:'cliente'+(i+1)+'@example.com',phone:null,marketing_consent:false,loyalty_opt_in:true});
            customers.push(customer.id);
           }
           const cash=await api('/v1/cash-sessions','POST',{terminal_code:'CAIXA-01',opening_cents:25000});
           for(let i=0;i<12;i++){
            const lines=[{variant_id:variants[(i*3)%variants.length].id,quantity:1},{variant_id:variants[(i*3+11)%variants.length].id,quantity:1+(i%3===0?1:0)}];
            const quote=await api('/v1/sales/quotes','POST',{lines});
            assert.ok(quote.can_commit,'Cotação não autorizada');
            await api('/v1/sales','POST',{cash_session_id:cash.id,lines:quote.lines.map(l=>({variant_id:l.variant_id,quantity:l.quantity,expected_price_cents:l.price_cents,expected_price_revision:l.price_revision})),payments:[{method:'cash',amount_cents:quote.total_cents,confirmed:true}],...(customers[i%customers.length]?{customer_id:customers[i%customers.length]}:{})});
           }
           const day=new Date().toISOString().slice(0,10);
           for(const [category,description,amount] of [['Embalagens','Sacolas e etiquetas',12990],['Marketing','Campanha de vitrine',18000],['Serviços','Manutenção da loja',9500]]){
            await api('/v1/management/expenses','POST',{category,description,amount_cents:amount,occurred_on:day});
           }
           console.info('DEMO_OK',JSON.stringify({products:products.length,variants:variants.length,customers:customers.length,sales:12,expenses:3,photos:products.length}));
           
           await appWindow.getByLabel('Usuário').fill('local-admin');
           await appWindow.getByLabel('Senha').fill('Senha-redefinida-CI-2026');
           await appWindow.getByRole('button',{name:'Entrar na loja'}).click();
           await appWindow.getByRole('dialog',{name:'Guia inicial da loja'}).waitFor({timeout:12000});
           await appWindow.getByRole('button',{name:'Reabrir tour'}).waitFor();
           // Regressão no binário instalado: Estoque não deve travar ou desmontar o PDV.
           await shot(appWindow,'04-guia-inicial');
           const skip=appWindow.getByRole('button',{name:'Pular tour'});
           if(await skip.isVisible())await skip.click();
           const stockDiagnostics=[];
           appWindow.on('pageerror',error=>stockDiagnostics.push('PAGEERROR '+error.message));
           appWindow.on('console',msg=>{if(msg.type()==='error')stockDiagnostics.push('CONSOLE '+msg.text().slice(0,400));});
           appWindow.on('requestfailed',request=>{if(request.url().includes('/assets/'))stockDiagnostics.push('ASSET_FAILED '+request.url().split('/').pop());});
           await appWindow.getByRole('button',{name:'Entrada de estoque'}).click();
           await appWindow.getByRole('heading',{name:'Estoque da loja'}).waitFor({timeout:20000});
           try{
            await appWindow.getByRole('heading',{name:'Planilha operacional'}).waitFor({timeout:12000});
           }catch(error){
            console.error('STOCK_DIAGNOSTICS_BODY:',(await appWindow.locator('body').innerText().catch(()=>'<body unavailable>')).slice(0,2800));
            console.error('STOCK_DIAGNOSTICS_EVENTS:',stockDiagnostics.slice(-20));
            console.error('STOCK_DIAGNOSTICS_RESOURCES:',JSON.stringify(await appWindow.evaluate(()=>performance.getEntriesByType('resource')
             .filter(entry=>/InventorySpreadsheet|react-data-grid|assets\\/.test(entry.name))
             .map(entry=>({asset:entry.name.split('/').pop(),duration_ms:Math.round(entry.duration),bytes:entry.transferSize}))).catch(e=>({error:e.message}))));
            throw error;
           }
           await shot(appWindow,'05-estoque');
           await appWindow.getByRole('button',{name:'PDV',exact:true}).click();
           await appWindow.getByRole('heading',{name:'Nova venda'}).waitFor({timeout:12000});
           await appWindow.locator('img.product-image').first().waitFor({timeout:30000});
           await appWindow.waitForTimeout(1500);
           await shot(appWindow,'06-pdv');
           for(const [label,heading,file] of [['Cadastrar produtos','Produtos','07-produtos'],['Caixa','Caixa','08-caixa'],['Gestão','Gestão','09-gestao'],['Configurações','Configurações','10-configuracoes']]){
            await appWindow.getByRole('button',{name:label,exact:true}).filter({visible:true}).first().click();
            await appWindow.getByRole('heading',{name:heading,exact:true}).first().waitFor({timeout:20000});
            await appWindow.waitForTimeout(1500);
            await shot(appWindow,file);
           }
           console.info('Windows one-computer: PostgreSQL, API, web, offline password recovery and tour operational');
          }finally{
           await instance?.close();
           await rm(userData,{recursive:true,force:true,maxRetries:8,retryDelay:500}).catch(error=>console.warn('Cleanup failed',error.message));
          }
          
          '@ | Set-Content -LiteralPath scripts/capture-desktop-qa.mjs -Encoding utf8
          $install=Join-Path $env:LOCALAPPDATA 'Programs\Loja de Roupas Fisica'
          node scripts/capture-desktop-qa.mjs "$install/app/electron.exe"
          if($LASTEXITCODE -ne 0){throw 'Captura incompleta'}
      - name: Montar PDF dos PNGs reais
        if: always()
        shell: pwsh
        run: |
          python -m pip install pillow
          @'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont, ImageOps
          files=sorted(Path('qa-desktop-prints').glob('*.png'))
          if not files:
              raise SystemExit('Nenhuma captura')
          labels=['Configuração inicial','Login','Recuperação de acesso','Guia inicial','Estoque','PDV','Produtos','Caixa','Gestão','Configurações']
          pages=[]
          for file in files:
              i=int(file.name[:2])
              page=Image.new('RGB',(1800,1200),'white')
              draw=ImageDraw.Draw(page)
              title=ImageFont.truetype('C:/Windows/Fonts/arialbd.ttf',40)
              small=ImageFont.truetype('C:/Windows/Fonts/arial.ttf',24)
              draw.text((60,38),labels[i-1],font=title,fill='#172B3A')
              draw.text((60,96),'Loja de Roupas Física v0.2.7 | Electron | Playwright | Dados e imagens ilustrativas',font=small,fill='#526575')
              img=Image.open(file).convert('RGB')
              img=ImageOps.contain(img,(1680,970))
              page.paste(img,((1800-img.width)//2,150+(970-img.height)//2))
              draw.text((60,1150),f'Captura {i:02d} | GitHub Actions',font=small,fill='#526575')
              pages.append(page)
          pages[0].save('qa-desktop-prints/Loja-Roupas-Fisica-v0.2.7-Demo.pdf',save_all=True,append_images=pages[1:],resolution=150)
          '@ | Set-Content -LiteralPath qa-pdf.py -Encoding utf8
          python qa-pdf.py
          if($LASTEXITCODE -ne 0){throw 'PDF falhou'}
      - name: Arquivar PNGs e PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loja-fisica-v0.2.7-demo-prints-pdf
          path: qa-desktop-prints/
          retention-days: 30
          if-no-files-found: error
