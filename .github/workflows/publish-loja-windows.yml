name: Publicar instalador Loja de Roupas v0.2.2
on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/package.json'
      - '.github/workflows/publish-loja-windows.yml'
permissions:
  contents: write
jobs:
  publish-windows:
    # Publica somente por comando explícito de merge, nunca em pushes normais.
    if: contains(github.event.head_commit.message, '[publish-loja-v0.2.2]')
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirmar versão e sintaxe do assistente
        shell: pwsh
        run: |
          $info=Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json
          if ($info.version -ne '0.2.2') { throw 'Versão do desktop deve ser 0.2.2' }
          node --check apps/desktop/src/main.cjs
          node --check apps/desktop/src/updates.cjs
          node --check apps/desktop/src/desktop-updater.cjs
          node --check apps/desktop/src/update-preload.cjs
          node --check apps/desktop/src/recovery-preload.cjs
          node --check apps/desktop/src/window-health.cjs
          $tokens=$null
          $issues=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path apps/desktop/src/update-helper.ps1).Path,[ref]$tokens,[ref]$issues) | Out-Null
          if ($issues.Count) { throw 'Sintaxe do assistente PowerShell inválida' }
      - name: Instalar dependências fixadas
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate
          pnpm install --frozen-lockfile
          if($LASTEXITCODE -ne 0){throw 'Falha nas dependências'}
      - name: Testar e compilar cliente Windows e PostgreSQL
        shell: pwsh
        run: |
          pnpm --filter @loja/api typecheck
          if($LASTEXITCODE -ne 0){throw 'Typecheck API falhou'}
          pnpm --filter @loja/api test
          if($LASTEXITCODE -ne 0){throw 'Testes API falharam'}
          pnpm --filter @loja/desktop test
          if($LASTEXITCODE -ne 0){throw 'Testes do desktop falharam'}
          pnpm --filter @loja/desktop build
          if($LASTEXITCODE -ne 0){throw 'Build desktop falhou'}
          pnpm --filter @loja/web build
          if($LASTEXITCODE -ne 0){throw 'Build web falhou'}
          pwsh -NoProfile -File scripts/prepare-windows-runtime.ps1
          if($LASTEXITCODE -ne 0){throw 'Empacotamento PostgreSQL/API falhou'}
          $root='dist/desktop-win32-x64/resources'
          foreach($file in @(
            "$root/app/main.cjs",
            "$root/app/update-preload.cjs",
            "$root/app/recovery-preload.cjs",
            "$root/app/recovery.html",
            "$root/app/window-health.cjs",
            "$root/runtime/api/src/reset-local-admin.ts",
            "$root/runtime/prerequisites/vc_redist.x64.exe",
            "$root/app/desktop-updater.cjs",
            "$root/app/updates.cjs",
            "$root/app/update-helper.ps1",
            "$root/runtime/api/src/main.ts",
            "$root/runtime/postgres/bin/initdb.exe",
            "$root/runtime/postgres/bin/pg_dump.exe",
            "$root/runtime/web/index.html"
          )){
            if(!(Test-Path -LiteralPath $file -PathType Leaf)){throw "Arquivo ausente: $file"}
          }
          & "$root/runtime/postgres/bin/initdb.exe" --version
          if($LASTEXITCODE -ne 0){throw 'initdb não inicia: DLL ausente'}
          & "$root/runtime/postgres/bin/pg_ctl.exe" --version
          if($LASTEXITCODE -ne 0){throw 'pg_ctl não inicia: DLL ausente'}
          $version=(Get-Content "$root/app/package.json" -Raw | ConvertFrom-Json).version
          if($version -ne '0.2.2'){throw 'Versão embutida divergente'}
      - name: Gerar instalador NSIS e executar testes reais
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $compiler)) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Falha ao instalar NSIS' }
          }
          & $compiler /V2 infra/desktop/loja-roupas.nsi
          if($LASTEXITCODE -ne 0){throw 'Compilação NSIS falhou'}
          $setup=(Resolve-Path dist/Loja-de-Roupas-Setup-x64.exe).Path
          $install=Join-Path $env:LOCALAPPDATA 'Programs\Loja de Roupas'
          $process=Start-Process $setup -ArgumentList '/S' -Wait -PassThru
          if($process.ExitCode -ne 0 -or !(Test-Path "$install/app/electron.exe")){
            throw 'Instalação Windows falhou'
          }
          node scripts/smoke-installed-desktop.mjs "$install/app/electron.exe"
          if($LASTEXITCODE -ne 0){throw 'Aplicativo instalado não abre'}
          node scripts/smoke-single-machine.mjs "$install/app/electron.exe"
          if($LASTEXITCODE -ne 0){throw 'Falha no primeiro uso com PostgreSQL'}
          $installedVersion=(Get-Content "$install/app/resources/app/package.json" -Raw | ConvertFrom-Json).version
          if($installedVersion -ne '0.2.2'){throw 'Versão instalada diferente da release'}
          $process=Start-Process "$install/Uninstall.exe" -ArgumentList '/S' -Wait -PassThru
          if($process.ExitCode -ne 0){throw 'Falha na desinstalação'}
          $deadline=(Get-Date).AddSeconds(30)
          while((Test-Path "$install/app/electron.exe") -and (Get-Date) -lt $deadline){Start-Sleep -Milliseconds 300}
          if(Test-Path "$install/app/electron.exe"){throw 'Arquivos não removidos'}
      - name: Gerar e validar SHA256SUMS
        shell: pwsh
        run: |
          Set-Location dist
          $exe='Loja-de-Roupas-Setup-x64.exe'
          $hash=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $exe" | Out-File -LiteralPath SHA256SUMS -Encoding ascii
          if((Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash){
            throw 'Checksum divergente'
          }
          if((Get-Item $exe).Length -le 0){throw 'Instalador vazio'}
      - name: Guardar cópia do instalador validado
        uses: actions/upload-artifact@v4
        with:
          name: loja-roupas-v0.2.2-windows-release
          path: |
            dist/Loja-de-Roupas-Setup-x64.exe
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Publicar GitHub Release v0.2.2 (única vez)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo='${{ github.repository }}'
          $tag='v0.2.2'
          $existing=gh release view $tag --repo $repo --json tagName 2>$null
          if($LASTEXITCODE -eq 0){throw "Release $tag já existe: não sobrescrever"}
          $tagExists=git ls-remote --tags origin "refs/tags/$tag"
          if($LASTEXITCODE -ne 0){throw 'Não foi possível verificar a tag remota'}
          if($tagExists){throw "Tag $tag já existe: publicação interrompida"}
          @'
          ## Loja de Roupas v0.2.2 — Windows x64

          Correção de estabilidade da interface desktop. Trata carregamento incompleto da página, falhas no processo gráfico e erros de renderização que antes podiam deixar uma janela branca.

          ### Correções desta versão
          - Falhas de renderização React agora exibem recuperação no lugar da tela branca.
          - Erros de navegação e travamentos do processo gráfico apresentam diálogo nativo.
          - Diagnóstico local limitado a códigos de erro, sem senhas nem dados da loja.
          - Quando o JavaScript não carrega, a página mostra orientação para recarregar.
          - Banco de dados, produtos e vendas permanecem intactos.

          ### Instalação
          Baixe **Loja-de-Roupas-Setup-x64.exe** e execute no Windows 64 bits. O assistente prepara banco, API e interface no próprio computador, sem hospedagem e sem assinatura obrigatória.

          ### Atualizações com autorização explícita
          - Ao abrir o app, verifica somente metadados no GitHub e mostra uma janela modal se houver nova versão.
          - Em Configurações → Atualizações há verificação manual, versão e novidades.
          - O download do EXE só começa após clicar e confirmar: não existe download silencioso.
          - Verifica SHA-256, cria backup local do PostgreSQL antes de atualizar e preserva snapshot de recuperação do aplicativo.

          ### Integridade e cuidados
          O arquivo **SHA256SUMS** nesta release contém a impressão digital SHA-256 do EXE. Testes automatizados de instalação, primeiro acesso e desinstalação foram executados; periféricos físicos de clientes ainda exigem homologação em campo.

          Núcleo R$0 / self-hosted / open source.
          '@ | Set-Content -LiteralPath dist/RELEASE_NOTES.md -Encoding UTF8
          gh release create $tag 'dist/Loja-de-Roupas-Setup-x64.exe' 'dist/SHA256SUMS' --repo $repo --target '${{ github.sha }}' --title 'Loja de Roupas v0.2.2' --notes-file 'dist/RELEASE_NOTES.md' --latest
          if($LASTEXITCODE -ne 0){throw 'Falha na publicação GitHub Release'}
          $published=gh release view $tag --repo $repo --json tagName,isDraft,isPrerelease,assets,url | ConvertFrom-Json
          if($published.isDraft -or $published.isPrerelease){throw 'Release não estável'}
          if(!($published.assets.name -contains 'Loja-de-Roupas-Setup-x64.exe')){throw 'EXE não encontrado na release'}
          if(!($published.assets.name -contains 'SHA256SUMS')){throw 'SHA256SUMS não encontrado na release'}
          Write-Host "PUBLICADA: $($published.url)"
