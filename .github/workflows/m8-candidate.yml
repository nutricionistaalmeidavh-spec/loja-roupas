name: M8 - candidata a distribuição
on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'infra/**'
      - 'scripts/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/m8-candidate.yml'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências fixadas
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate
          pnpm install --frozen-lockfile
      - name: Compilar e empacotar cliente portátil
        run: |
          pnpm --filter @loja/web build
          pnpm --filter @loja/desktop build
          test -x dist/desktop-linux-x64/electron
          test -s dist/desktop-linux-x64/resources/app/main.cjs
      - name: Instalar e remover a candidata Debian
        run: |
          bash scripts/package-debian.sh
          sudo apt-get install --yes xvfb ./dist/loja-roupas_*_amd64.deb
          test -x /usr/bin/loja-roupas
          test -s /opt/loja-roupas/resources/app/main.cjs
          xvfb-run -a node scripts/smoke-installed-desktop.mjs /opt/loja-roupas/electron
          sudo dpkg --remove loja-roupas
          test ! -e /usr/bin/loja-roupas
      - name: Gerar pacote e verificar checksum
        run: |
          cd dist
          tar -czf loja-roupas-candidata-linux-x64.tar.gz desktop-linux-x64
          sha256sum loja-roupas-candidata-linux-x64.tar.gz loja-roupas_*_amd64.deb > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Guardar pacote para revisão
        uses: actions/upload-artifact@v4
        with:
          name: m8-candidata-linux-x64
          path: |
            dist/loja-roupas-candidata-linux-x64.tar.gz
            dist/loja-roupas_*_amd64.deb
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
  candidate-windows:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências fixadas
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate
          pnpm install --frozen-lockfile
      - name: Empacotar cliente portátil Windows
        run: |
          pnpm --filter @loja/desktop build
          if (!(Test-Path dist/desktop-win32-x64/electron.exe -PathType Leaf)) { throw 'Executável ausente' }
          if (!(Test-Path dist/desktop-win32-x64/resources/app/main.cjs -PathType Leaf)) { throw 'Entrada do aplicativo ausente' }
          Set-Location dist
          Compress-Archive -Path desktop-win32-x64 -DestinationPath loja-roupas-candidata-windows-x64.zip
          $hash = (Get-FileHash loja-roupas-candidata-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  loja-roupas-candidata-windows-x64.zip" | Out-File -Encoding ascii SHA256SUMS
          if ((Get-FileHash loja-roupas-candidata-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) {
            throw 'Checksum divergente'
          }
      - name: Gerar, instalar e remover a candidata Windows
        run: |
          $compiler = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $compiler)) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Falha ao instalar NSIS' }
          }
          & $compiler /V2 infra/desktop/loja-roupas.nsi
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao compilar o instalador' }
          $setup = (Resolve-Path dist/Loja-de-Roupas-Setup-x64.exe).Path
          $install = Join-Path $env:LOCALAPPDATA 'Programs\Loja de Roupas'
          $process = Start-Process $setup -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0 -or !(Test-Path "$install/app/electron.exe")) { throw 'Instalação falhou' }
          node scripts/smoke-installed-desktop.mjs "$install/app/electron.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Cliente instalado falhou no smoke test' }
          $process = Start-Process "$install/Uninstall.exe" -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Remoção falhou' }
          $deadline = (Get-Date).AddSeconds(30)
          while ((Test-Path "$install/app/electron.exe") -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 300 }
          if (Test-Path "$install/app/electron.exe") { throw 'Arquivos ainda instalados' }
          Set-Location dist
          $hash = (Get-FileHash Loja-de-Roupas-Setup-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Loja-de-Roupas-Setup-x64.exe" | Out-File -Append -Encoding ascii SHA256SUMS
      - name: Guardar pacote para revisão
        uses: actions/upload-artifact@v4
        with:
          name: m8-candidata-windows-x64
          path: |
            dist/loja-roupas-candidata-windows-x64.zip
            dist/Loja-de-Roupas-Setup-x64.exe
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
