name: M1 - Build, Auth e Banco (self-hosted compatível)
on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'infra/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/m1-integration.yml'
jobs:
  m1:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: loja
          POSTGRES_USER: loja
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loja -d loja"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://loja:ci-only-password@127.0.0.1:5432/loja
      TEST_DATABASE_URL: postgresql://loja:ci-only-password@127.0.0.1:5432/loja
    steps:
      - uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: pnpm 10
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate
      - name: Instalar pacotes OSS
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck de domínio, API e Web
        run: |
          pnpm --filter @loja/domain typecheck
          pnpm --filter @loja/api typecheck
          pnpm --filter @loja/web typecheck
      - name: Testes do cliente Web (fluxos e contrato)
        run: pnpm --filter @loja/web test
      - name: Build web
        run: pnpm --filter @loja/web build
      - name: Testes de domínio
        run: pnpm test
      - name: Migrações PostgreSQL canônico
        run: pnpm --filter @loja/api migrate
      - name: Bootstrap de administrador de QA (somente banco efêmero)
        env:
          BOOTSTRAP_STORE: Loja QA
          BOOTSTRAP_ADMIN_LOGIN: qa-admin
          BOOTSTRAP_ADMIN_PASSWORD: Senha-QA-Somente-CI-2026
        run: pnpm --filter @loja/api bootstrap
      - name: Testes API/RBAC/catálogo
        run: pnpm --filter @loja/api test
      - name: Instalar Chromium open source para Playwright
        run: pnpm --filter @loja/web exec playwright install --with-deps chromium
      - name: E2E Web real (login → cadastro → estoque → carrinho)
        run: pnpm --filter @loja/web test:e2e
      - name: Publicar somente evidências de QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-ui-playwright-evidence
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore
