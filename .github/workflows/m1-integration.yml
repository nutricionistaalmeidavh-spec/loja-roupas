name: M1 - Build, Auth e Banco (self-hosted compatível)
on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'infra/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/m1-integration.yml'
jobs:
  m1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: loja
          POSTGRES_USER: loja
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loja -d loja"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://loja:ci-only-password@127.0.0.1:5432/loja
      TEST_DATABASE_URL: postgresql://loja:ci-only-password@127.0.0.1:5432/loja
    steps:
      - uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: pnpm 10
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate
      - name: Instalar pacotes OSS
        run: pnpm install --frozen-lockfile
      - name: Typecheck de domínio, API e Web
        run: |
          pnpm --filter @loja/domain typecheck
          pnpm --filter @loja/api typecheck
          pnpm --filter @loja/web typecheck
      - name: Testes do cliente Web (fluxos e contrato)
        run: pnpm --filter @loja/web test
      - name: Build web
        run: pnpm --filter @loja/web build
      - name: Testes de domínio
        run: pnpm test
      - name: Migrações PostgreSQL canônico
        run: pnpm --filter @loja/api migrate
      - name: Bootstrap de administrador de QA (somente banco efêmero)
        env:
          BOOTSTRAP_STORE: Loja QA
          BOOTSTRAP_ADMIN_LOGIN: qa-admin
          BOOTSTRAP_ADMIN_PASSWORD: Senha-QA-Somente-CI-2026
        run: pnpm --filter @loja/api bootstrap
      - name: Testes API/RBAC/catálogo
        run: pnpm --filter @loja/api test
      - name: Testar paginação da vitrine opcional (Node nativo)
        run: node --test cloudflare/loja-roupas-vitrine/test/marketplace.test.mjs
      - name: Instalar Chromium open source para Playwright
        timeout-minutes: 6
        run: pnpm --filter @loja/web exec playwright install --with-deps chromium
      - name: Preparar axe-core OSS somente para QA (fora das dependências do produto)
        run: |
          npm install --prefix "$RUNNER_TEMP/loja-axe" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund axe-core@4.10.3
          test -s "$RUNNER_TEMP/loja-axe/node_modules/axe-core/axe.min.js"
          echo "LOJA_AXE_CORE_PATH=$RUNNER_TEMP/loja-axe/node_modules/axe-core/axe.min.js" >> "$GITHUB_ENV"
      - name: E2E Web real (login → cadastro → estoque → carrinho)
        env:
          LOJA_E2E_BUILT: '1'
        run: pnpm --filter @loja/web test:e2e
      - name: Ler etiqueta e conferir PDFs térmicos
        run: |
          sudo apt-get update
          sudo apt-get install --yes zbar-tools poppler-utils
          label=$(find apps/web/test-results -name code128.png -print -quit)
          receipt58=$(find apps/web/test-results -name comprovante-58.pdf -print -quit)
          receipt80=$(find apps/web/test-results -name comprovante-80.pdf -print -quit)
          decoded=$(zbarimg --quiet --raw "$label")
          [[ $decoded == POS-QA-* ]]
          for receipt in "$receipt58" "$receipt80"; do
            pdftotext -layout "$receipt" - | grep -Fi 'COMPROVANTE NÃO FISCAL'
          done
          pdfinfo "$receipt58" | awk '/^Page size:/ {if ($3<163 || $3>166) exit 1; ok=1} END {if (!ok) exit 1}'
          pdfinfo "$receipt80" | awk '/^Page size:/ {if ($3<225 || $3>228) exit 1; ok=1} END {if (!ok) exit 1}'
      - name: Publicar somente evidências de QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-ui-playwright-evidence
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore
