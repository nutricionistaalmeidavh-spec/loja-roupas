name: Instalação LAN e restauração
on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'infra/**'
      - 'scripts/**'
      - 'pnpm-*.yaml'
      - '.github/workflows/lan-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Instalar e abrir Web e API na mesma origem
        run: |
          printf '\n\nLoja de teste\nqa-admin\nSenha-LAN-Somente-CI\n' | bash scripts/install-lan.sh
          curl --fail --silent http://127.0.0.1:8080/ | grep -F '<div id="root">'
          curl --fail --silent http://127.0.0.1:8080/manifest.webmanifest | jq -e '.start_url == "/" and (.icons|length == 2)'
          curl --fail --silent http://127.0.0.1:8080/service-worker.js | grep -F "event.request.mode !== 'navigate'"
          curl --fail --silent http://127.0.0.1:8080/v1/auth/sessions \
            -H 'Content-Type: application/json' \
            -d '{"login":"qa-admin","password":"Senha-LAN-Somente-CI"}' | jq -e '.stores[0].store_id'
      - name: Verificar leituras concorrentes na instalação LAN
        run: |
          auth=$(curl --fail --silent http://127.0.0.1:8080/v1/auth/sessions \
            -H 'Content-Type: application/json' \
            -d '{"login":"qa-admin","password":"Senha-LAN-Somente-CI"}')
          token=$(jq -er '.token' <<< "$auth")
          store=$(jq -er '.stores[0].store_id' <<< "$auth")
          export token store
          seq 1 40 | xargs -P 8 -n 1 bash -euo pipefail -c '
            curl --fail --silent --max-time 10 http://127.0.0.1:8080/v1/management/intelligence \
              -H "Authorization: Bearer $token" -H "X-Store-Id: $store" | jq -e ".months | length == 12" >/dev/null
          ' _
      - name: Cifrar, restaurar e comparar dados de teste
        run: |
          export LOJA_BACKUP_PASSPHRASE_FILE="$RUNNER_TEMP/loja-backup-passphrase"
          (umask 077 && openssl rand -hex 32 > "$LOJA_BACKUP_PASSPHRASE_FILE")
          source scripts/lan-common.sh
          lan exec -T postgres psql -X -v ON_ERROR_STOP=1 -U loja -d loja <<'SQL'
          WITH product AS (
            INSERT INTO products(store_id,name,category)
            SELECT id,'Produto QA','QA' FROM stores RETURNING id,store_id
          )
          INSERT INTO product_photos(product_id,store_id,content_type,image_bytes,sha256)
          SELECT id,store_id,'image/png',decode(repeat('cafe',8),'hex'),repeat('a',64) FROM product;
          INSERT INTO product_variants(store_id,product_id,sku,color,size,price_cents)
          SELECT store_id,id,'SKU-QA-OFFLINE','Preto','M',1000 FROM products WHERE name='Produto QA';
          SQL
          scripts/backup-lan.sh "$RUNNER_TEMP/loja.gpg"
          scripts/restore-lan.sh "$RUNNER_TEMP/loja.gpg" loja_restore_smoke
          for database in loja loja_restore_smoke; do
            lan exec -T postgres psql -XAt -U loja -d "$database" \
              -c "SELECT u.login, encode(p.image_bytes,'hex') FROM users u CROSS JOIN product_photos p" > "$RUNNER_TEMP/$database.txt"
          done
          cmp "$RUNNER_TEMP/loja.txt" "$RUNNER_TEMP/loja_restore_smoke.txt"
          grep -Fx 'qa-admin|cafecafecafecafecafecafecafecafe' "$RUNNER_TEMP/loja_restore_smoke.txt"
      - name: Validar backup cifrado rotativo em pasta externa
        run: |
          bash scripts/test-backup-scripts.sh
          export LOJA_BACKUP_PASSPHRASE_FILE="$RUNNER_TEMP/loja-backup-passphrase"
          export LOJA_BACKUP_RETENTION_DAYS=7
          mkdir -p "$RUNNER_TEMP/loja-rotativa"
          scripts/backup-lan-rotate.sh "$RUNNER_TEMP/loja-rotativa"
          count=$(find "$RUNNER_TEMP/loja-rotativa" -maxdepth 1 -name 'loja-*.gpg' -type f | wc -l)
          test "$count" -eq 1
          archive=$(find "$RUNNER_TEMP/loja-rotativa" -maxdepth 1 -name 'loja-*.gpg' -type f | head -1)
          test -s "$archive"
          # Validar assinatura PGDMP dentro do arquivo GPG sem deixar dump em disco.
          source scripts/lan-common.sh
          # Guardar apenas a lista de objetos em memória evita SIGPIPE quando o grep
          # termina antes de o pg_restore consumir todo o arquivo criptografado.
          objects=$(backup_gpg --decrypt "$archive" | lan exec -T postgres pg_restore --list -U loja)
          grep -Fq "TABLE DATA" <<< "$objects"
          test -z "$(find "$RUNNER_TEMP/loja-rotativa" -maxdepth 1 -name '.loja-backup.*' -print -quit)"
      - name: Verificar perda e recuperação do banco
        run: |
          source scripts/lan-common.sh
          lan stop postgres
          code=$(curl --silent --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v1/ready)
          test "$code" = 503
          lan up -d --wait postgres
          curl --fail --silent --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:8080/v1/ready
      - name: Operar na rede isolada sem rota WAN
        run: |
          source scripts/lan-common.sh
          lan down
          override="$RUNNER_TEMP/loja-offline-compose.yml"
          printf 'networks:\n  default:\n    internal: true\n' > "$override"
          offline() {
            docker compose --env-file .env.lan -p loja-roupas-lan \
              -f infra/compose.lan.yml -f "$override" "$@"
          }
          offline up -d --no-build --pull never --wait
          test "$(docker network inspect --format '{{.Internal}}' loja-roupas-lan_default)" = true
          offline exec -T api node --input-type=module -e '
            const url = "http://web:8080";
            const login = await fetch(url+"/v1/auth/sessions",{method:"POST",headers:{"content-type":"application/json"},
              body:JSON.stringify({login:"qa-admin",password:"Senha-LAN-Somente-CI"})});
            if (!login.ok) throw new Error("Falha de autenticação na rede isolada");
            const session = await login.json();
            const inventory = await fetch(url+"/v1/catalog/products", {headers:{
              Authorization:"Bearer "+session.token, "X-Store-Id":session.stores[0].store_id}});
            if (!inventory.ok || !(await inventory.json()).items.some(item=>item.name==="Produto QA"))
              throw new Error("Catálogo existente indisponível na rede isolada");
          '
      - name: Diagnóstico
        if: failure()
        run: |
          source scripts/lan-common.sh
          if [ -f .env.lan ]; then lan logs --tail 80; fi
